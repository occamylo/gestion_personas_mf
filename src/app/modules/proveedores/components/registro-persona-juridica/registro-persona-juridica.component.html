<plantilla-pagina-contenedora
  [icon]="'corporate_fare'"
  [title]="'Registro Único de Persona Jurídica'"
  [breadcrumb]="'<p>Gestión de Proveedores > <b>Persona Jurídica</b></p>'"
>

  <stepper-visual
    [label]="'Progreso del registro de persona jurídica'"
    [pasos]="pasos"
    [(pasoActual)]="pasoActual"
  ></stepper-visual>

  <section class="contenido-pasos" aria-label="Información del registro">
    @switch (pasoActual) {
      @case (1) {
        <registro-persona-juridica-paso-1></registro-persona-juridica-paso-1>
        }
      @case (2) {
        <registro-persona-juridica-paso-2></registro-persona-juridica-paso-2>
      }
      @case (3) {
        <registro-persona-juridica-paso-3></registro-persona-juridica-paso-3>
      }
      @case (4) {
        <registro-persona-juridica-paso-4></registro-persona-juridica-paso-4>
      }
    }
  </section>

  <section class="barra-acciones" aria-label="Acciones del registro">
    <div class="estado-autoguardado" aria-live="polite">
      <mat-icon class="estado-autoguardado__icono" aria-hidden="true">cloud_done</mat-icon>
      <div class="estado-autoguardado__texto">
        <strong>[mock] Borrador societario autoguardado con éxito</strong>
        <span>Hoy a las 11:45 AM · Sesión cifrada SSL 256-bit Universidad Distrital</span>
      </div>
    </div>

    <div class="acciones">
      @if (pasoActual > 1) {
        <button class="boton-borrador" type="button" (click)="pasoActual = pasoActual - 1">
          <mat-icon aria-hidden="true">arrow_back</mat-icon>
          <span>Regresar</span>
        </button>
      }
      <button class="boton-borrador" type="button">
        <mat-icon aria-hidden="true">save</mat-icon>
        <span>Guardar Borrador</span>
      </button>
      @if (pasoActual < pasos.length) {
        <button class="boton-acento" type="button" (click)="pasoActual = pasoActual + 1">
          <span>Continuar</span>
          <mat-icon aria-hidden="true">arrow_forward</mat-icon>
        </button>
      } @else {
        <button class="boton-acento" type="button" (click)="finalizar()">
          <span>Finalizar</span>
          <mat-icon aria-hidden="true">check_circle</mat-icon>
        </button>
      }
    </div>
  </section>

</plantilla-pagina-contenedora>
